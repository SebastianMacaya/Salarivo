<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#176c4a">
    <meta name="robots" content="noindex">
    <title>Sin conexión — Salarivo</title>
    <link rel="icon" href="/pwa/logo.svg" type="image/svg+xml">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: #f8faf8; color: #17352b; font: 1rem/1.6 system-ui, sans-serif; padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left)); }
      main { width: 100%; max-width: 28rem; }
      img { width: 48px; height: 48px; }
      h1 { font-size: clamp(1.6rem, 6vw, 2rem); line-height: 1.2; }
      button, a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: .65rem 1rem; border: 1px solid #176c4a; border-radius: .65rem; font: inherit; cursor: pointer; }
      button { background: #176c4a; color: white; }
      a { color: #176c4a; text-decoration: none; }
      .actions { display: flex; flex-wrap: wrap; gap: .75rem; }
      :focus-visible { outline: 3px solid #176c4a; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/logo.svg" width="48" height="48" alt="Salarivo">
      <h1>Sin conexión</h1>
      <p>Necesitás conexión a Internet para acceder a esta información.</p>
      <p>Tus recibos y datos salariales no se guardan para consultarlos sin conexión.</p>
      <div class="actions"><button type="button" onclick="window.location.reload()">Reintentar</button><a href="/">Ir al inicio</a></div>
    </main>
  </body>
</html>
