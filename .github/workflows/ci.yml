name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      PUBLIC_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
      DATABASE_URL: postgresql://salarivo:salarivo_local_change_me@127.0.0.1:5432/salarivo
      QUEUE_URL: redis://127.0.0.1:6379
      OBJECT_STORAGE_ACCESS_KEY: salarivo
      OBJECT_STORAGE_SECRET_KEY: salarivo_local_change_me_123
      OBJECT_STORAGE_BUCKET: salarivo-documents-local
      OBJECT_STORAGE_INTERNAL_ENDPOINT: http://127.0.0.1:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      OBJECT_STORAGE_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build web
        run: npm run build --workspace @salarivo/web

      - name: Validate Docker Compose
        run: docker compose --profile processing --env-file .env.example config --quiet

      - name: Start integration dependencies
        run: |
          docker compose --env-file .env.example up -d --wait postgres redis minio
          curl --retry 30 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:9000/minio/health/live

      - name: Run migrations
        run: npm run db:migrate

      - name: Integration tests
        run: npm run test:integration

      - name: Stop integration dependencies
        if: always()
        run: docker compose --env-file .env.example down --volumes
